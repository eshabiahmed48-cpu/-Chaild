<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - متجرنا</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="logo">متجرنا</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="products.html">المنتجات</a></li>
            <li><a href="contact.html" class="active">اتصل بنا</a></li>
        </ul>
    </nav>

    <!-- نموذج الاتصال -->
    <main class="contact-page">
        <h1>تواصل معنا</h1>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">الاسم الكامل:</label>
                <input type="text" id="name" name="name" required placeholder="أدخل اسمك هنا">
            </div>
            
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
            </div>
            
            <div class="form-group">
                <label for="message">رسالتك:</label>
                <textarea id="message" name="message" required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            
            <button type="submit" class="btn" style="width: 100%;">إرسال الرسالة</button>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
